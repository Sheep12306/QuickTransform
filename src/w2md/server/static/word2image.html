<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word 图片提取 - QuickTransform</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="word2image.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">W→IMG</span>
      <div class="brand-text">
        <h1>QuickTransform</h1>
        <p>Word 图片提取</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="home-link" href="/">返回首页</a>
      <div class="topbar-status">本地运行 · 原图导出</div>
    </div>
  </header>

  <main class="layout image-layout">
    <section class="image-hero">
      <h2>提取 Word 里的所有图片</h2>
      <p>直接读取 DOCX 内部原图，按正文出现顺序罗列。不重新编码，保留原扩展名、原始字节和画质。</p>
    </section>

    <section class="drop-panel" id="drop-panel">
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入 Word 文档">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p class="dropzone-title">拖入 .docx 文件，或点击选择</p>
        <p class="dropzone-hint">只展示图片，不生成 Markdown；文档只在本机处理</p>
        <input type="file" id="file-input" accept=".docx" hidden>
      </div>
    </section>

    <section class="status-panel hidden" id="status-panel">
      <div class="spinner"></div>
      <p id="status-text">正在提取图片…</p>
    </section>

    <section class="result hidden" id="result">
      <div class="gallery-toolbar">
        <div class="gallery-summary">
          <strong id="result-file"></strong>
          <span id="result-summary"></span>
        </div>
        <div class="gallery-actions">
          <button class="ghost-btn" id="download-manifest" type="button" title="一键下载 manifest.json" disabled>manifest.json</button>
          <label class="format-filter">
            <span>格式</span>
            <select id="format-filter" aria-label="按图片格式筛选">
              <option value="">全部格式</option>
            </select>
          </label>
          <label class="select-all">
            <input type="checkbox" id="select-all">
            <span>全选</span>
          </label>
          <button class="ghost-btn copy-primary" id="copy-selected" type="button" disabled>复制选中 (0)</button>
          <button class="ghost-btn" id="download-zip" type="button" disabled>打包下载</button>
          <button class="icon-btn" id="reset-btn" type="button" title="重新选择" aria-label="重新选择">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="gallery" id="gallery"></div>
      <div class="empty-state hidden" id="empty-state">没有在正文中检测到图片。</div>

      <footer class="gallery-footer">
        <span id="gallery-hint">复制和打包使用「上传副本」：普通 PNG/JPEG 原样复制，EMF/WMF 已转 PNG，超限图片使用预览版；「下载原图」保留原始文件。剪贴板一次建议不超过 20 张，大量图片请用「全选」+「打包下载」。</span>
      </footer>
    </section>
  </main>

  <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="word2image.js"></script>
</body>
</html>
