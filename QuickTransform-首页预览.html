<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickTransform - 本地转换工具箱</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fcf9;
      --surface: #ffffff;
      --surface-muted: #f0f8f4;
      --border: #dcebe3;
      --border-strong: #c8ddd1;
      --text: #17211b;
      --muted: #5f7568;
      --accent: #049664;
      --accent-hover: #037d53;
      --accent-soft: #e6f7ef;
      --accent-gradient: linear-gradient(135deg, #049664 0%, #037d53 100%);
      --shadow-sm: 0 1px 2px rgba(18, 73, 48, .06);
      --shadow-md: 0 12px 30px rgba(18, 73, 48, .10);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(4, 150, 100, .07) 0, transparent 260px),
        var(--bg);
      color: var(--text);
      font-family: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }

    ::selection { background: rgba(4, 150, 100, .18); color: inherit; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      padding: 0 34px;
      background: rgba(255, 255, 255, .88);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      animation: fade-down .45s ease-out both;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 5px 12px rgba(4, 150, 100, .22);
    }

    .brand-text h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .brand-text p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .home-btn:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-1px); }
    .home-btn svg { width: 15px; height: 15px; }

    main { width: min(1060px, calc(100% - 48px)); margin: 0 auto; padding: 54px 0 70px; }

    .hero { margin-bottom: 32px; animation: rise .55s .06s ease-out both; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 14px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

    .hero h2 { margin: 0; font-size: 31px; font-weight: 750; line-height: 1.24; letter-spacing: 0; }
    .hero p { margin: 12px 0 0; color: var(--muted); font-size: 15px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 190px;
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      animation: rise .55s ease-out both;
    }

    .tool-card:nth-child(1) { animation-delay: .1s; }
    .tool-card:nth-child(2) { animation-delay: .16s; }
    .tool-card:nth-child(3) { animation-delay: .22s; }
    .tool-card:nth-child(4) { animation-delay: .28s; }

    .tool-card::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: var(--accent-gradient);
      opacity: 0;
      transition: opacity .18s ease;
    }

    .tool-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .tool-card:hover::after { opacity: 1; }

    .tool-card.muted { background: #fbfdfc; color: var(--muted); }
    .tool-card.muted .tool-icon { background: var(--surface-muted); color: var(--muted); }

    .tool-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(4, 150, 100, .08);
    }

    .tool-icon svg { width: 21px; height: 21px; }

    .tool-card h3 { margin: 0 0 8px; font-size: 18px; font-weight: 700; letter-spacing: 0; }
    .tool-card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 16px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    .tool-card.muted .badge { background: var(--surface-muted); color: var(--muted); }

    .arrow {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      transition: color .18s ease, transform .18s ease, background .18s ease;
    }

    .tool-card:hover .arrow { color: var(--accent); background: var(--accent-soft); transform: translateX(3px); }
    .arrow svg { width: 15px; height: 15px; }

    @keyframes fade-down { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 680px) {
      .topbar { padding: 0 20px; }
      main { width: min(100% - 32px, 1060px); padding: 36px 0 52px; }
      .hero h2 { font-size: 25px; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .topbar, .hero, .tool-card { animation: none; }
      .tool-card, .home-btn { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">QT</span>
      <div class="brand-text">
        <h1>QuickTransform</h1>
        <p>本地转换工具箱</p>
      </div>
    </div>
    <a class="home-btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      返回首页
    </a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">离线 · 本地 · 不传云端</p>
      <h2>把常用格式转换，留在自己电脑里</h2>
      <p>一个窗口完成 Word、Markdown、PDF 等常用格式转换。</p>
    </section>

    <section class="grid">
      <a class="tool-card" href="#">
        <span class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="m8 14 3 3 5-6"/></svg>
        </span>
        <h3>Word 转 Markdown</h3>
        <p>保留标题、表格、图片与基础样式，适合 PRD 上传云端做记录。</p>
        <span class="card-foot">
          <span class="badge">已上线</span>
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
        </span>
      </a>

      <a class="tool-card" href="#">
        <span class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 17h8"/><path d="M8 13h5"/></svg>
        </span>
        <h3>Word 转 PDF</h3>
        <p>最大程度还原分页、字体、表格与图片，适合简历和正式文档。</p>
        <span class="card-foot">
          <span class="badge">即将上线</span>
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
        </span>
      </a>

      <a class="tool-card muted" href="#">
        <span class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
        </span>
        <h3>Excel 转 CSV</h3>
        <p>用于表格数据导出，后续按需加入。</p>
        <span class="card-foot">
          <span class="badge">规划中</span>
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
        </span>
      </a>

      <a class="tool-card muted" href="#">
        <span class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        </span>
        <h3>图片格式转换</h3>
        <p>PNG、JPG、WebP 等格式互转，后续按需加入。</p>
        <span class="card-foot">
          <span class="badge">规划中</span>
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
