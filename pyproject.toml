[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quicktranser"
version = "0.1.0"
description = "Word (.docx) to Markdown converter for ERP product docs"
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.scripts]
w2md = "w2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

