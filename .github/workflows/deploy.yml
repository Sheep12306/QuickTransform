name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avz
            --no-owner
            --no-group
            --exclude='.git/'
            --exclude='.github/'
            --exclude='.tools/'
            --exclude='__pycache__/'
            --exclude='*.py[cod]'
            --exclude='.venv/'
            --exclude='samples/out/'
          path: ./
          remote_path: /opt/quicktransform/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Remove retired legacy pages and restart service
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          eval "$(ssh-agent -s)"
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
          echo "ssh-add rc=$?"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          echo "connecting to ${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'rm -f /opt/quicktransform/src/w2md/server/static/placeholder_replace.html /opt/quicktransform/src/w2md/server/static/placeholder_replace.js; systemctl restart quicktransform && sleep 3 && systemctl is-active quicktransform'
          rc=$?
          echo "ssh rc=$rc"
          exit $rc

      - name: Tune nginx upload limits
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          eval "$(ssh-agent -s)"
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'python3 /opt/quicktransform/deploy/tune_nginx.py'
