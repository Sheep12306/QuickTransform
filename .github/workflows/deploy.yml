name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avz
            --no-owner
            --no-group
            --exclude='.git/'
            --exclude='.github/'
            --exclude='.tools/'
            --exclude='__pycache__/'
            --exclude='*.py[cod]'
            --exclude='.venv/'
            --exclude='samples/out/'
          path: ./
          remote_path: /opt/quicktransform/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set +e
            systemctl restart quicktransform
            restart_rc=$?
            sleep 3
            systemctl is-active quicktransform
            active_rc=$?
            echo "restart_rc=${restart_rc} active_rc=${active_rc}"
            if [ "${restart_rc}" -ne 0 ] || [ "${active_rc}" -ne 0 ]; then
              echo "=== status ==="
              systemctl status quicktransform --no-pager -l
              echo "=== journal ==="
              journalctl -u quicktransform -n 40 --no-pager
              exit 1
            fi
